name: re-deploy-main-to-gcp.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # safer than StrictHostKeyChecking=no
          ssh-keyscan -H "34.118.169.254" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_USER: firmestmoon43
          SSH_HOST: 34.118.169.254
          APP_DIR:  app/server 
          PM2_NAME: app 
        run: |
          ssh -i ~/.ssh/deploy_key -T "$SSH_USER@$SSH_HOST" <<EOF
            set -e

            cd "$APP_DIR"
          
            git pull
            npm ci

            pm2 restart "$PM2_NAME" || pm2 start app.js --name "$PM2_NAME"

            pm2 save
          EOF
